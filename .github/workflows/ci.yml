
name: CI & CD Pipeline 

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'gmail-viewer-app/**'
      - 'mail-to-telegram/**'
      - 'docker/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'gmail-viewer-app/**'
      - 'mail-to-telegram/**'
      - 'docker/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: longtb11/mail-to-telegram
  TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # shallow clone for speed

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: gmail-viewer-app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('gmail-viewer-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build with env (with cache)
        env:
          NEXT_PUBLIC_SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1

      - name: Tag images
        env:
          TAG: ${{ github.sha }}
        run: |
          docker tag longtb11/gmail-viewer longtb11/gmail-viewer:$TAG
          docker tag longtb11/mail-to-telegram longtb11/mail-to-telegram:$TAG
          docker tag longtb11/gmail-websocket longtb11/gmail-websocket:$TAG

      - name: Push images
        env:
          TAG: ${{ github.sha }}
        run: |
          docker push longtb11/gmail-viewer:$TAG
          docker push longtb11/mail-to-telegram:$TAG
          docker push longtb11/gmail-websocket:$TAG
  clean-up:
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Cleanup Docker on server
        run: |
          echo "Stopping containers..."
          docker stop gmail-viewer 
          docker stop mail-to-telegram 
          docker stop gmail-websocket

          echo "Removing containers..."
          docker rm gmail-viewer 
          docker rm mail-to-telegram
          docker rm gmail-websocket

          echo "Docker prune..."
          docker system prune -af

  deploy_mysql:
    needs: clean-up
    
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy mysql and apply migrations
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          docker network create netflix-network 
          docker volume create mysql_data

          DB_NAME="${MYSQL_DATABASE:-netflix-mail}"
          DB_USER="${MYSQL_USER:-admin}"
          DB_PASSWORD="${MYSQL_PASSWORD:-Passw0rd123}"
          ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD:-Passw0rd123}"

          create_mysql_container() {
            docker run -d \
              --name mysql \
              --network netflix-network \
              -p 3306:3306 \
              -e MYSQL_ROOT_PASSWORD="$ROOT_PASSWORD" \
              -e MYSQL_DATABASE="$DB_NAME" \
              -e MYSQL_USER="$DB_USER" \
              -e MYSQL_PASSWORD="$DB_PASSWORD" \
              -v mysql_data:/var/lib/mysql \
              --health-cmd="mysqladmin ping -h localhost -u$DB_USER -p$DB_PASSWORD" \
              --health-interval=10s \
              --health-timeout=5s \
              --health-retries=10 \
              mysql:8.0
          }

          if docker ps -a --format '{{.Names}}' | grep -qx 'mysql'; then
            echo "MySQL container already exists. Reusing it."
            port_bindings=$(docker inspect -f '{{json .HostConfig.PortBindings}}' mysql)
            if echo "$port_bindings" | grep -q '"3306/tcp"' && echo "$port_bindings" | grep -q '"HostPort":"3306"'; then
              docker start mysql 
              docker network connect netflix-network mysql 
            else
              echo "MySQL exists but is not bound to host port 3306. Recreating container..."
              docker rm -f mysql 
              create_mysql_container
            fi
          else
            echo "Creating MySQL container for first time..."
            create_mysql_container
          fi

          echo "Waiting for MySQL to be healthy..."
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' mysql || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MySQL did not become healthy in time"
              docker logs mysql
              exit 1
            fi
            sleep 5
          done

          docker exec mysql mysql -u"$DB_USER" -p"$DB_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS \`$DB_NAME\`;"
          docker exec mysql mysql -u"$DB_USER" -p"$DB_PASSWORD" -D "$DB_NAME" -e "
            CREATE TABLE IF NOT EXISTS schema_migrations (
              id BIGINT AUTO_INCREMENT PRIMARY KEY,
              filename VARCHAR(255) NOT NULL UNIQUE,
              applied_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          "

          echo "Applying only new SQL migrations"
          for sql in "$GITHUB_WORKSPACE"/docker/mysql-init/*.sql; do
            [ -f "$sql" ] || continue
            filename="$(basename "$sql")"
            is_applied=$(docker exec mysql mysql -N -s -u"$DB_USER" -p"$DB_PASSWORD" -D "$DB_NAME" -e "SELECT 1 FROM schema_migrations WHERE filename='$filename' LIMIT 1;")

            if [ "$is_applied" = "1" ]; then
              echo "Skipping already applied migration: $filename"
              continue
            fi

            echo "Applying migration: $filename"
            docker exec -i mysql mysql -u"$DB_USER" -p"$DB_PASSWORD" < "$sql"
            docker exec mysql mysql -u"$DB_USER" -p"$DB_PASSWORD" -D "$DB_NAME" -e "INSERT INTO schema_migrations (filename) VALUES ('$filename');"
          done

  deploy_websocket:
    needs: clean-up
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy websocket
        env:
          TAG: ${{ github.sha }}
        run: |
          docker network create netflix-network 
          docker pull longtb11/gmail-websocket:$TAG
          docker run -d \
            --name gmail-websocket \
            --network netflix-network \
            -p 3001:3001 \
            longtb11/gmail-websocket:$TAG

  deploy_mail_to_telegram:
    needs: deploy_mysql
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy mail-to-telegram
        env:
          TAG: ${{ github.sha }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALLOWED_SENDER: ${{ secrets.ALLOWED_SENDER }}
          SLEEPTIME: ${{ secrets.SLEEPTIME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          docker network create netflix-network 
          docker pull longtb11/mail-to-telegram:$TAG
          docker run -d \
            --name mail-to-telegram \
            --network netflix-network \
            -e MYSQL_HOST="$MYSQL_HOST" \
            -e MYSQL_PORT="3306" \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -e GMAIL_USER="$GMAIL_USER" \
            -e GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
            -e TELEGRAM_TOKEN="$TELEGRAM_TOKEN" \
            -e CHAT_ID="$CHAT_ID" \
            -e ALLOWED_SENDER="$ALLOWED_SENDER" \
            -e SLEEPTIME="$SLEEPTIME" \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
            -e SERVER_HOST="$SERVER_HOST" \
            longtb11/mail-to-telegram:$TAG

  deploy_gmail_viewer:
    needs: deploy_mysql
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy gmail-viewer to server
        env:
          TAG: ${{ github.sha }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NEXT_PUBLIC_SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          docker network create netflix-network 
          docker pull longtb11/gmail-viewer:$TAG
          docker run -d \
            --name gmail-viewer \
            --network netflix-network \
            -e MYSQL_HOST="$MYSQL_HOST" \
            -e MYSQL_PORT="3306" \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -e NEXT_PUBLIC_SERVER_HOST="$NEXT_PUBLIC_SERVER_HOST" \
            -p 80:80 \
            longtb11/gmail-viewer:$TAG
